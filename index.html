<script>
// Dark first. Apply the saved look and theme before first paint so there is no flash.
(function () {
  var t = 'dark', look = 'nova';
  try { t = localStorage.getItem('gc-dashboard-theme-v1') || 'dark'; } catch (e) {}
  try { look = localStorage.getItem('gc-dashboard-look-v1') || 'nova'; } catch (e) {}
  if (look !== 'classic') look = 'nova';
  document.documentElement.setAttribute('data-theme', t === 'light' ? 'light' : 'dark');
  document.documentElement.setAttribute('data-look', look);
  document.write('<link rel="stylesheet" href="css/app.css">');
  document.write('<link rel="stylesheet" href="css/' + look + '.css" id="look-css-' + look + '">');
})();
</script>
