<script>
// A new visit opens in Nova dark. A choice lasts for the tab (sessionStorage) and is kept for later visits only
// if the visitor turns on "Remember my choice" (localStorage). Applied before first paint so there is no flash.
(function () {
  var t = 'dark', look = 'nova', pref = {};
  try { pref = JSON.parse(sessionStorage.getItem('gc-dashboard-session') || localStorage.getItem('gc-dashboard-pref') || '{}') || {}; } catch (e) {}
  if (pref.t === 'light') t = 'light';
  if (pref.l === 'classic') look = 'classic';
  var bg = pref.b === 'still' || pref.b === 'off' ? pref.b : 'flow';
  var d = document.documentElement;
  d.setAttribute('data-theme', t);
  d.setAttribute('data-look', look);
  d.setAttribute('data-bg', bg);
  window.gcPref = {
    now: function () { return JSON.stringify({ l: d.getAttribute('data-look'), t: d.getAttribute('data-theme'), b: d.getAttribute('data-bg') }); },
    save: function () { try { var v = this.now(); sessionStorage.setItem('gc-dashboard-session', v); if (localStorage.getItem('gc-dashboard-pref')) localStorage.setItem('gc-dashboard-pref', v); } catch (e) {} },
    pinned: function () { try { return !!localStorage.getItem('gc-dashboard-pref'); } catch (e) { return false; } },
    pin: function (on) { try { if (on) localStorage.setItem('gc-dashboard-pref', this.now()); else localStorage.removeItem('gc-dashboard-pref'); } catch (e) {} }
  };
  document.write('<link rel="stylesheet" href="css/app.css">');
  document.write('<link rel="stylesheet" href="css/' + look + '.css" id="look-css-' + look + '">');
})();
</script>
